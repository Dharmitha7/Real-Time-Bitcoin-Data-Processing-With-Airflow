[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-pipeline"
version = "0.1.0"
description = "Real-time Bitcoin data ingestion pipeline orchestrated with Airflow"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "requests>=2.32,<3.0",
    "boto3>=1.35,<2.0",
    "pydantic>=2.7,<3.0",
    "tenacity>=8.2,<10.0",
    "pandera>=0.20,<1.0",
    "pyarrow>=16.0,<19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.14,<4.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "black>=24.0,<25.0",
    "moto[s3]>=5.0,<6.0",
    "responses>=0.25,<1.0",
]

[tool.setuptools]
packages = ["bitcoin_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
